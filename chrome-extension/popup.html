<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mission Control</title>

    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 18px;
            background: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #4CAF50;
        }

        h3 {
            margin: 18px 0 10px;
            color: #00E5FF;
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0;
        }

        .label {
            font-weight: bold;
        }

        .value {
            color: #00E5FF;
            text-align: right;
            word-break: break-word;
        }

        .nominal {
            color: #4CAF50;
            font-weight: bold;
        }

        .warning {
            color: #FFC107;
            font-weight: bold;
        }

        .critical {
            color: #F44336;
            font-weight: bold;
        }

        hr {
            margin: 18px 0;
            border: none;
            border-top: 1px solid #333;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        .connection {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FFC107;
        }

        .connected {
            background: #4CAF50;
        }

        .disconnected {
            background: #F44336;
        }

        #refreshButton {
            background: #2196F3;
        }

        #refreshButton:hover {
            background: #1976D2;
        }

        .subsystem-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .subsystem-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
        }

        .subsystem-name {
            font-weight: bold;
        }

        .subsystem-badge {
            display: inline-block;
            min-width: 72px;
            padding: 4px 8px;
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .subsystem-badge.nominal {
            background: rgba(76, 175, 80, 0.15);
        }

        .subsystem-badge.warning {
            background: rgba(255, 193, 7, 0.15);
        }

        .subsystem-badge.critical {
            background: rgba(244, 67, 54, 0.15);
        }

        .alarm-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .alarm-item {
            padding: 8px 10px;
            border-radius: 6px;
            background: #222;
            border-left: 4px solid #FFC107;
            font-size: 12px;
            line-height: 1.4;
        }

        .alarm-item.warning {
            border-left-color: #FFC107;
        }

        .alarm-item.critical {
            border-left-color: #F44336;
        }

        .no-alarms {
            color: #888;
            font-size: 12px;
            text-align: center;
            padding: 8px 0;
        }

        .error-message {
            color: #F44336;
            font-size: 12px;
            text-align: center;
            margin: 10px 0;
        }

        .section {
            margin-top: 4px;
        }

        #lastUpdate {
            color: #00E5FF;
        }
    </style>
</head>

<body>

    <h2>Mission Control</h2>

    <div class="connection">
        <div id="connectionDot" class="dot"></div>
        <span id="connectionText">Connecting...</span>
    </div>

    <div
        style="
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 18px;
        "
    >
        Last update:
        <span id="lastUpdate">---</span>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div class="row">
        <span class="label">Satellite</span>
        <span id="satellite" class="value">---</span>
    </div>

    <div class="row">
        <span class="label">Battery</span>
        <span id="battery" class="value">---</span>
    </div>

    <div class="row">
        <span class="label">Temperature</span>
        <span id="temperature" class="value">---</span>
    </div>

    <div class="row">
        <span class="label">Signal</span>
        <span id="signal" class="value">---</span>
    </div>

    <div class="row">
        <span class="label">CPU</span>
        <span id="cpu" class="value">---</span>
    </div>

    <div class="row">
        <span class="label">Status</span>
        <span id="status" class="value">---</span>
    </div>

    <div class="section">
        <h3>Subsystem Health</h3>

        <div id="subsystemList" class="subsystem-list">
            <div class="no-alarms">Loading subsystem configuration...</div>
        </div>
    </div>

    <div class="section">
        <h3>Active Alarms</h3>

        <div id="alarmList" class="alarm-list">
            <div class="no-alarms">No active alarms</div>
        </div>
    </div>

    <hr>

    <button id="refreshButton">
        Refresh Telemetry
    </button>

    <br><br>

    <button id="openDashboard">
        Open Mission Dashboard
    </button>

    <script src="popup.js"></script>

</body>

</html>
