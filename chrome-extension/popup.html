<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Mission Control</title>

<style>

body{
    width:280px;
    margin:0;
    padding:18px;
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

h2{
    margin-top:0;
    text-align:center;
    color:#4CAF50;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.label{
    font-weight:bold;
}

.value{
    color:#00E5FF;
}

/* Status colors */

.nominal{
    color:#4CAF50;
    font-weight:bold;
}

.warning{
    color:#FFC107;
    font-weight:bold;
}

.critical{
    color:#F44336;
    font-weight:bold;
}

hr{

    margin:18px 0;

    border:none;

    border-top:1px solid #333;

}

button{

    width:100%;

    padding:10px;

    background:#4CAF50;

    color:white;

    border:none;

    border-radius:6px;

    font-size:14px;

    cursor:pointer;

}

button:hover{

    background:#43a047;

}

.connection{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-bottom:18px;

    font-size:14px;

}

.dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#FFC107;

}

.connected{

    background:#4CAF50;

}

.disconnected{

    background:#F44336;

}

#refreshButton{

    background:#2196F3;

}

#refreshButton:hover{

    background:#1976D2;

}

</style>

</head>

<body>

<h2>Mission Control</h2>
<div class="connection">
    <div
    id="connectionDot"
    class="dot">
</div>

<span id="connectionText">
    Connecting...
</span>

</div>
<div
style="
text-align:center;
color:#999;
font-size:12px;
margin-bottom:18px;">
Last update:
<span id="lastUpdate">
    ---
</span>

</div>
<div class="row">
<span class="label">Satellite</span>
<span id="satellite" class="value">---</span>
</div>

<div class="row">
<span class="label">Battery</span>
<span id="battery" class="value">---</span>
</div>

<div class="row">
<span class="label">Temperature</span>
<span id="temperature" class="value">---</span>
</div>

<div class="row">
<span class="label">Signal</span>
<span id="signal" class="value">---</span>
</div>

<div class="row">
<span class="label">CPU</span>
<span id="cpu" class="value">---</span>
</div>

<div class="row">
<span class="label">Status</span>
<span id="status" class="value">---</span>
</div>

<hr>

<button id="refreshButton">
    Refresh Telemetry
</button>

<br><br>

<button id="openDashboard">
    Open Mission Dashboard
</button>

<script src="popup.js"></script>

</body>
</html>
